services:
  sentinel-api:
    build: ./api
    image: sentinel-api:latest
    container_name: sentinel-api
    # DB 접속 정보. sentinel.env.example 복사 후 작성
    env_file: ./sentinel.env
    environment:
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    # 호스트의 PostgreSQL(localhost:5432) 접근용. Docker Desktop은 기본 제공, Linux용 명시
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # always는 설정 오류 시 무한 재시작 루프. 수동 중지 시에는 재시작하지 않음
    restart: unless-stopped
    # 기동 완료 판정. 컨테이너 시작만으로는 Spring 기동 전이므로 포트 개방까지 대기 (up --wait, web의 depends_on에 사용)
    # JRE 이미지에 curl·wget이 없어 셸의 TCP 연결로 확인. 스프링은 기동 완료 후 포트를 연다
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 3s
      retries: 40

  sentinel-web:
    build: ./web
    image: sentinel-web:latest
    container_name: sentinel-web
    environment:
      # 서버 전용 Spring 주소. 컨테이너 간 통신은 localhost가 아닌 서비스 이름 사용
      INTERNAL_API_URL: http://sentinel-api:8080
      TZ: Asia/Seoul
    ports:
      - "3000:3000"
    # api 기동 완료 후 시작. 첫 화면 요청이 api 기동 전에 실패하지 않도록 함
    depends_on:
      sentinel-api:
        condition: service_healthy
    restart: unless-stopped
    # / 는 로그인 화면으로 이동하며 wget이 따라가 200 확인
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 3s
      timeout: 3s
      retries: 30
