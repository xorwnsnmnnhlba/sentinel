# E2E 테스트 전용 스택. PostgreSQL까지 포함하여 독립 실행
#
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#   docker compose -f docker-compose.e2e.yml down -v
#
# - 운영/개발 스택(docker-compose.yml)과 포트·볼륨이 겹치지 않도록 별도 포트 사용 (HTTPS 13443, HTTP 13080, api 18080)
# - DB는 컨테이너 내부 통신만 사용(호스트 포트 미개방). 데이터는 down -v로 매번 폐기
# - 비밀번호는 이 일회용 컨테이너 전용. 실제 자격증명 아님
name: sentinel-e2e

services:
  e2e-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel-e2e
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30

  e2e-api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://e2e-postgres:5432/sentinel?currentSchema=sentinel
      DB_USERNAME: sentinel
      DB_PASSWORD: sentinel-e2e
      # 시크릿 암호화 키. 일회용 테스트 스택 전용 값
      SENTINEL_SECRET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # 최초 관리자 계정. 일회용 테스트 스택 전용 값
      SENTINEL_ADMIN_EMAIL: admin@sentinel.test
      SENTINEL_ADMIN_PASSWORD: e2e-admin-password
      TZ: Asia/Seoul
    ports:
      - "18080:8080"
    depends_on:
      e2e-postgres:
        condition: service_healthy
    # JRE 이미지에 curl·wget이 없어 셸의 TCP 연결로 확인. 스프링은 기동 완료 후 포트를 연다
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 3s
      retries: 40

  e2e-web:
    build: ./web
    environment:
      INTERNAL_API_URL: http://e2e-api:8080
      TZ: Asia/Seoul
    # 테스트는 HTTPS 앞단(e2e-proxy)을 거침. 직접 접속은 같은 PC에서 확인할 때만
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      e2e-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 3s
      timeout: 3s
      retries: 30

  # HTTPS 앞단. 운영과 같은 Caddyfile로 실제 경로(TLS, Host 전달, Secure 쿠키, Server Action 출처 확인) 검증
  e2e-proxy:
    image: caddy:2.11.4-alpine
    environment:
      # 테스트 포트를 주소에 포함해야 HTTP→HTTPS 이동이 이 포트로 향함
      # sentinel.e2e.test는 사내 이름 역할 (HSTS 확인용, 브라우저가 127.0.0.1로 해석하도록 테스트에서 지정)
      SENTINEL_SITE_ADDRESS: localhost:13443, sentinel.e2e.test:13443
      SENTINEL_UPSTREAM: e2e-web:3000
      SENTINEL_API_UPSTREAM: e2e-api:8080
      SENTINEL_TLS: internal
      SENTINEL_HSTS_MAX_AGE: 300
    ports:
      - "13443:13443"
      - "13080:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      e2e-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/"]
      interval: 2s
      timeout: 3s
      retries: 20
