# PR과 main 푸시마다 web·api 검증. 두 작업은 병렬 실행
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  api:
    name: api (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      # Gradle 캐시, wrapper 체크섬 검증
      - uses: gradle/actions/setup-gradle@v6
      # Testcontainers(PostgreSQL, WireMock)는 러너의 Docker 사용
      - run: ./gradlew test
      - name: 실패 시 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-report
          path: api/build/reports/tests/test
          retention-days: 7
