# PR과 main 푸시마다 web·api·E2E·배포 스크립트 검증. 작업은 병렬 실행
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # PostgreSQL·api·web·HTTPS 앞단을 모두 띄운 실제 스택 대상 (HTTPS 13443, api 18080)
      - name: E2E 스택 기동
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
      # 앱 요청마다 100ms 지연 (느린 모드). 빠른 응답에서는 드러나지 않는 타이밍 문제(화면 전환 전 클릭 등)를 PR 단계에서 발견
      - run: npm run e2e
        working-directory: web
        env:
          E2E_SLOW_MS: 100
      - name: 실패 시 리포트·스택 로그 보관
        if: failure()
        run: |
          mkdir -p web/playwright-report
          docker compose -f docker-compose.e2e.yml logs --no-color > web/playwright-report/stack.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: web/playwright-report
          retention-days: 7
      - name: E2E 스택 정리
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  scripts:
    name: scripts (preflight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 배포 전 점검 스크립트. 러너에 기본 설치된 shellcheck·OpenSSL 사용
      - run: shellcheck scripts/*.sh
      - run: bash scripts/preflight.test.sh
      # CI 연동 스크립트 (실행 대기). 흉내 낸 API 서버에 시나리오별로 실행
      - run: bash scripts/sentinel-run.test.sh

  api:
    name: api (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      # Gradle 캐시, wrapper 체크섬 검증
      - uses: gradle/actions/setup-gradle@v6
      # Testcontainers(PostgreSQL, WireMock)는 러너의 Docker 사용
      - run: ./gradlew test
      - name: 실패 시 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-report
          path: api/build/reports/tests/test
          retention-days: 7
