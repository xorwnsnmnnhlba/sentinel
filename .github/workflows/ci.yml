# PR과 main 푸시마다 web·api·E2E·배포 스크립트 검증. 작업은 병렬 실행
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # 커버리지는 보고만 (수치 기준으로 실패시키지 않음). 합계는 실행 요약, 자세한 내용은 산출물 web-coverage
      - run: npm run test:coverage
      - name: 커버리지 요약
        run: |
          {
            echo '### web 커버리지'
            jq -r '.total | "- 줄 \(.lines.pct)% (\(.lines.covered)/\(.lines.total))", "- 분기 \(.branches.pct)% (\(.branches.covered)/\(.branches.total))"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage
          retention-days: 14
      - run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # api·web 이미지는 GitHub Actions 캐시를 쓰는 빌더로 미리 빌드. 의존성(Gradle·npm) 단계를 재사용하여
      # 외부 저장소의 일시 장애와 다운로드 시간의 영향을 줄임 (2026-10-10 Gradle 플러그인 저장소 장애로 실패)
      # 이미지 이름은 docker-compose.e2e.yml의 image와 같아야 함
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: api 이미지 빌드
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          load: true
          provenance: false
          tags: sentinel-e2e-api
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,scope=e2e-api,mode=max
      - name: web 이미지 빌드
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          provenance: false
          tags: sentinel-e2e-web
          cache-from: type=gha,scope=e2e-web
          cache-to: type=gha,scope=e2e-web,mode=max
      # PostgreSQL·api·web·HTTPS 앞단을 모두 띄운 실제 스택 대상 (HTTPS 13443, api 18080)
      # 이미지가 이미 있으므로 빌드하지 않음 (--build 없음)
      - name: E2E 스택 기동
        run: docker compose -f docker-compose.e2e.yml up -d --wait
      # 앱 요청마다 100ms 지연 (느린 모드). 빠른 응답에서는 드러나지 않는 타이밍 문제(화면 전환 전 클릭 등)를 PR 단계에서 발견
      - run: npm run e2e
        working-directory: web
        env:
          E2E_SLOW_MS: 100
      - name: 실패 시 리포트·스택 로그 보관
        if: failure()
        run: |
          mkdir -p web/playwright-report
          docker compose -f docker-compose.e2e.yml logs --no-color > web/playwright-report/stack.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: web/playwright-report
          retention-days: 7
      - name: E2E 스택 정리
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  scripts:
    name: scripts (preflight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 배포 전 점검 스크립트. 러너에 기본 설치된 shellcheck·OpenSSL 사용
      - run: shellcheck scripts/*.sh
      - run: bash scripts/preflight.test.sh
      # CI 연동 스크립트 (실행 대기). 흉내 낸 API 서버에 시나리오별로 실행
      - run: bash scripts/sentinel-run.test.sh
      # 의존성 취약점 판정 (.github/workflows/security.yml에서 사용)
      - run: bash scripts/vulnerabilities.test.sh
      # 릴리스 버전: api·web 파일의 버전이 같은지 (태그 확인은 .github/workflows/release.yml)
      - run: bash scripts/release-version.test.sh
      - run: bash scripts/release-version.sh --check
      # README 스택 버전 표 확인 스크립트 (릴리스 때 실행, PR마다 표를 확인하지는 않음)
      - run: bash scripts/stack-versions.test.sh

  api:
    name: api (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 25
      # Gradle 캐시, wrapper 체크섬 검증
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Testcontainers(PostgreSQL, WireMock)는 러너의 Docker 사용
      - run: ./gradlew test jacocoTestReport
      # 커버리지는 보고만 (수치 기준으로 실패시키지 않음). 합계는 실행 요약, 자세한 내용은 산출물 api-coverage
      - name: 커버리지 요약
        run: |
          python3 - build/reports/jacoco/test/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          counters = {c.get('type'): c for c in ET.parse(sys.argv[1]).getroot().findall('counter')}
          print('### api 커버리지')
          for kind, label in (('LINE', '줄'), ('BRANCH', '분기')):
              missed, covered = int(counters[kind].get('missed')), int(counters[kind].get('covered'))
              print(f'- {label} {100 * covered / (missed + covered):.1f}% ({covered}/{missed + covered})')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage
          path: api/build/reports/jacoco/test/html
          retention-days: 14
      - name: 실패 시 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-report
          path: api/build/reports/tests/test
          retention-days: 7
