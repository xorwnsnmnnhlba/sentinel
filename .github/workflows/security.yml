# 의존성 취약점 점검. 의존성을 바꾼 PR은 막고, 매주 월요일 정기 점검은 새로 공개된 취약점을 실패로 표시
# - api Java 의존성: Gradle이 해석한 앱 실행 클래스패스(runtimeClasspath)를 잠금 파일로 뽑아 OSV-Scanner로 점검
#   이미지 점검은 jar에서 Maven 좌표를 추정하다 틀려(api 패키지 100개 중 47개, Spring·Tomcat 등) 취약점 조회가 빗나감
# - api·web·HTTPS 앞단(Caddy) 이미지: OSV-Scanner로 실제 이미지 안의 OS 패키지·Go 모듈 (Java 라이브러리도 함께 보고)
#   Caddy(Go 모듈·OS 패키지)는 보고만. 수정은 Caddy 새 버전 이미지로만 가능 (Dependabot docker-compose)
# - web 운영 의존성: npm audit (Next.js standalone 이미지에는 npm 패키지 정보가 남지 않아 이미지 점검으로는 보이지 않음)
# 막는 기준은 scripts/vulnerabilities.sh (애플리케이션 의존성의 높음 이상 중 수정 버전이 있는 것)
name: Security

on:
  pull_request:
    paths:
      - api/build.gradle
      - api/settings.gradle
      - api/gradle/**
      - api/Dockerfile
      - web/package.json
      - web/package-lock.json
      - web/Dockerfile
      - docker-compose.yml
      - scripts/vulnerabilities.sh
      - .github/workflows/security.yml
  schedule:
    # 월요일 09:00 KST
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OSV_SCANNER_VERSION: v2.6.0
  # osv-scanner_linux_amd64 체크섬 (공식 릴리스의 osv-scanner_SHA256SUMS). 버전을 올리면 함께 변경
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  dependencies:
    name: dependencies (vulnerabilities)
    runs-on: ubuntu-latest
    # 셸을 지정해야 pipefail 적용 (기본값 bash -e는 파이프 앞 명령의 실패를 무시). 판정 단계가 tee로 이어져 필요
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # devDependencies 제외. 취약점이 있으면 0이 아닌 코드로 끝나므로 판정은 마지막 단계에서
      # 레지스트리 오류로 결과가 비면 통과로 오인하지 않도록 결과 모양 확인
      - name: web 운영 의존성 점검
        working-directory: web
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          jq -e '.metadata.vulnerabilities' "$RUNNER_TEMP/npm-audit.json" > /dev/null
      # 이미지는 E2E와 같은 캐시(main에서 저장)로 빌드. 의존성이 그대로면 대부분 재사용
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: api 이미지 빌드
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          load: true
          provenance: false
          tags: sentinel-e2e-api
          cache-from: type=gha,scope=e2e-api
      - name: web 이미지 빌드
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          provenance: false
          tags: sentinel-e2e-web
          cache-from: type=gha,scope=e2e-web
      - name: OSV-Scanner 설치
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # build.gradle은 그대로 두고 init 스크립트로 이번 실행에서만 잠금 파일 생성 (api/gradle/ci/runtime-lockfile.init.gradle)
      - name: api 의존성 목록 (Gradle)
        working-directory: api
        run: |
          ./gradlew --init-script gradle/ci/runtime-lockfile.init.gradle dependencies \
            --configuration runtimeClasspath --write-locks > /dev/null
          test -s gradle.lockfile
      # 운영과 같은 태그 (docker-compose.yml의 sentinel-proxy)
      - name: Caddy 이미지 받기
        run: |
          proxy_image=$(sed -nE 's/^[[:space:]]+image:[[:space:]]+(caddy:[^[:space:]]+).*/\1/p' docker-compose.yml | head -n 1)
          test -n "$proxy_image"
          docker pull "$proxy_image"
          echo "PROXY_IMAGE=$proxy_image" >> "$GITHUB_ENV"
      # 종료 코드 1은 취약점 있음 (판정은 다음 단계), 그 외는 점검 오류로 실패
      # --all-packages: 취약점 없는 패키지도 출력하여 판정 단계에서 jar·Go 모듈을 실제로 읽었는지 확인
      - name: 이미지 점검
        run: |
          for target in api=sentinel-e2e-api:latest web=sentinel-e2e-web:latest proxy="$PROXY_IMAGE"; do
            "$RUNNER_TEMP/osv-scanner" scan image --all-packages --format json "${target#*=}" \
              > "$RUNNER_TEMP/osv-${target%%=*}.json" || [ $? -eq 1 ]
          done
          "$RUNNER_TEMP/osv-scanner" scan source --all-packages --format json --lockfile api/gradle.lockfile \
            > "$RUNNER_TEMP/osv-gradle.json" || [ $? -eq 1 ]
      # --expect·--expect-package: 있어야 할 생태계·패키지가 결과에 없으면 점검 누락으로 실패 (취약점 0건으로 오인 방지)
      # Gradle 목록은 정확한 좌표로 확인 (이미지 점검이 잘못 읽던 핵심 라이브러리)
      - name: 판정
        run: |
          bash scripts/vulnerabilities.sh \
            --osv "$RUNNER_TEMP/osv-gradle.json" --expect-package org.springframework:spring-core \
              --expect-package org.apache.tomcat.embed:tomcat-embed-core --expect-package org.postgresql:postgresql \
            --osv "$RUNNER_TEMP/osv-api.json" --expect Ubuntu \
            --osv "$RUNNER_TEMP/osv-web.json" --expect Alpine \
            --osv "$RUNNER_TEMP/osv-proxy.json" --expect Go \
            --npm "$RUNNER_TEMP/npm-audit.json" | tee -a "$GITHUB_STEP_SUMMARY"

  # 정기 점검(수동 실행 포함) 결과를 저장소 이슈로 알림. 실패 메일은 cron을 마지막으로 바꾼 사람에게만 가서 놓치기 쉬움
  # 실패하면 이슈를 열고(이미 열려 있으면 댓글), 다시 통과하면 닫음. 취소된 실행은 무시
  report:
    name: report (scheduled)
    needs: dependencies
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Weekly security check failed
      RESULT: ${{ needs.dependencies.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 이슈 열기·닫기
        run: |
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE) | .number] | first // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "다시 통과: $RUN_URL"
            fi
          elif [ "$RESULT" = failure ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "다시 실패: $RUN_URL"
            else
              gh issue create --title "$TITLE" --body "$(printf '%s\n\n%s\n%s' \
                "매주 월요일 의존성 취약점 점검 실패: $RUN_URL" \
                "- 실행 요약(Summary)의 표에서 막힌 의존성 확인 후 의존성 업데이트 PR(Dependabot 또는 직접) 머지, 서버 업데이트 (docs/deploy.md \"업데이트\")" \
                "- 점검 오류(결과 없음, 패키지 누락)면 해당 단계 로그 확인. 다음 정기 점검이 통과하면 이 이슈는 자동으로 닫힘")"
            fi
          fi
