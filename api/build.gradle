plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sentinel'
version = '1.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Spring Boot 4.1.1이 관리하는 Jackson(3.1.5·2.21.5)에 높음 취약점이 있어 같은 minor의 수정판으로 올림 (2026-10-11)
// Spring Boot가 수정판을 관리하게 되면 제거 (.github/workflows/security.yml로 확인)
ext['jackson-bom.version'] = '3.1.7'
ext['jackson-2-bom.version'] = '2.21.7'

// Spring Boot 4.1.1이 관리하는 Tomcat 11.0.24에 치명 취약점 3건(CVE-2026-68525·65905·65182)이 있어 같은 minor의 최신 수정판으로 올림 (2026-10-15)
// 모두 Tomcat 자체 인증(FORM·DIGEST)·서블릿 보안 제약 관련으로 이 앱은 사용하지 않음(인증은 AuthFilter). Spring Boot가 수정판을 관리하게 되면 제거
ext['tomcat.version'] = '11.0.27'

// 시스템 상태 화면의 버전·빌드 시각 (META-INF/build-info.properties → BuildProperties)
springBoot {
	buildInfo()
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.jayway.jsonpath:json-path'
	// 케이스 가져오기의 OpenAPI 문서 해석. YAML 1.2는 JSON을 포함하므로 두 형식 모두 이 파서로 읽음
	// Jackson YAML 모듈은 별칭(*ref)을 펼치지 않고 앵커 이름 문자열로 바꾸므로 미사용. Boot 미관리 의존성이라 버전 명시
	implementation 'org.snakeyaml:snakeyaml-engine:3.2'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// BCrypt만 사용. 보안 스타터는 자동 설정이 전체 요청을 가로채므로 미사용 (인증은 직접 구현)
	implementation 'org.springframework.security:spring-security-crypto'
	// 실행기 HTTP 클라이언트. 연결할 주소를 직접 해석·확인할 수 있는 DnsResolver 지원 (JDK HttpClient는 미지원)
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	// 타입 안전 쿼리. 엔티티에서 생성한 Q-타입으로 JPQL 조립 (필드명 문자열 대신 컴파일 시점 확인)
	// 원본 com.querydsl은 5.1.0 이후 릴리스가 없어 유지보수 중인 OpenFeign 포크 사용 (Hibernate 7 대응). Boot 미관리 의존성이라 버전 명시
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jakarta'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	// API 문서(OpenAPI JSON) 생성. 화면은 web에서 그리므로 Swagger UI 없는 api 스타터. Boot 미관리 의존성이라 버전 명시
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
	// 컨트롤러 Javadoc을 API 문서의 설명으로 (컴파일 시 Javadoc을 런타임에 읽을 수 있게 저장)
	implementation 'com.github.therapi:therapi-runtime-javadoc:0.15.0'
	annotationProcessor 'com.github.therapi:therapi-runtime-javadoc-scribe:0.15.0'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Docker 이미지의 의존성 레이어용 (api/Dockerfile). dependencies 작업은 의존성 목록(POM)만 받으므로 jar까지 내려받음
// 소스만 바뀐 빌드는 이 레이어를 재사용하여 네트워크 없이 컴파일 (Maven Central 일시 장애 영향 없음)
tasks.register('downloadDependencies') {
	def classpaths = files(configurations.compileClasspath, configurations.annotationProcessor,
			configurations.runtimeClasspath)
	doLast {
		classpaths.files
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
