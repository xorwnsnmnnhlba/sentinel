plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.sentinel'
version = '1.5.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// 컴파일러 경고를 모두 켜고 경고가 있으면 실패 (새 경고가 쌓이지 않도록, 2026-10-18)
// 제외: classfile(QueryDSL jar 자체의 경고), serial(예외를 직렬화하지 않음), processing(Lombok·QueryDSL이 처리하지 않는 애너테이션 안내)
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:all,-classfile,-serial,-processing', '-Werror']
}

// 시스템 상태 화면의 버전·빌드 시각 (META-INF/build-info.properties → BuildProperties)
springBoot {
	buildInfo()
}

// jar 풀기·계층 이미지용 도구(spring-boot-jarmode-tools)는 넣지 않음. 이미지는 java -jar로 바로 실행 (api/Dockerfile)
// 이 도구는 Spring Boot 플러그인이 직접 넣어 앱 의존성(runtimeClasspath)에 없으므로 주간 의존성 점검(OSV)이 보지 못함 (2026-10-18)
tasks.named('bootJar') {
	includeTools = false
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.jayway.jsonpath:json-path'
	// 케이스 가져오기의 OpenAPI 문서 해석. YAML 1.2는 JSON을 포함하므로 두 형식 모두 이 파서로 읽음
	// Jackson YAML 모듈은 별칭(*ref)을 펼치지 않고 앵커 이름 문자열로 바꾸므로 미사용. Boot 미관리 의존성이라 버전 명시
	implementation 'org.snakeyaml:snakeyaml-engine:3.2'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// BCrypt만 사용. 보안 스타터는 자동 설정이 전체 요청을 가로채므로 미사용 (인증은 직접 구현)
	implementation 'org.springframework.security:spring-security-crypto'
	// 실행기 HTTP 클라이언트. 연결할 주소를 직접 해석·확인할 수 있는 DnsResolver 지원 (JDK HttpClient는 미지원)
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	// 타입 안전 쿼리. 엔티티에서 생성한 Q-타입으로 JPQL 조립 (필드명 문자열 대신 컴파일 시점 확인)
	// 원본 com.querydsl은 5.1.0 이후 릴리스가 없어 유지보수 중인 OpenFeign 포크 사용 (Hibernate 7 대응). Boot 미관리 의존성이라 버전 명시
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jakarta'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	// API 문서(OpenAPI JSON) 생성. 화면은 web에서 그리므로 Swagger UI 없는 api 스타터. Boot 미관리 의존성이라 버전 명시
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
	// 컨트롤러 Javadoc을 API 문서의 설명으로 (컴파일 시 Javadoc을 런타임에 읽을 수 있게 저장)
	implementation 'com.github.therapi:therapi-runtime-javadoc:0.15.0'
	annotationProcessor 'com.github.therapi:therapi-runtime-javadoc-scribe:0.15.0'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Docker 이미지의 의존성 레이어용 (api/Dockerfile). dependencies 작업은 의존성 목록(POM)만 받으므로 jar까지 내려받음
// 소스만 바뀐 빌드는 이 레이어를 재사용하여 네트워크 없이 컴파일 (Maven Central 일시 장애 영향 없음)
tasks.register('downloadDependencies') {
	def classpaths = files(configurations.compileClasspath, configurations.annotationProcessor,
			configurations.runtimeClasspath)
	doLast {
		classpaths.files
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// 테스트 커버리지 보고서 (./gradlew test jacocoTestReport → build/reports/jacoco). 수치 기준으로 실패시키지 않음
// JaCoCo는 Gradle 기본 버전. 테스트 단계에서만 쓰여 이미지(bootJar)에는 영향 없음
tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
	// QueryDSL이 만든 Q 클래스(엔티티별 조회용)는 제외
	classDirectories.setFrom(files(classDirectories.files.collect { dir ->
		fileTree(dir) { exclude 'com/sentinel/domain/Q*.class' }
	}))
}

// 변이 검사 (./gradlew pitest → build/reports/pitest). 주 1회 CI(.github/workflows/mutation.yml)에서 보고만, 기준 미달로 실패시키지 않음
// 대상: 외부 연결 없이 도는 판정·값 추출·구조 지문(runner), 문서 변환(importing), 엔티티 검증·상태 변경(domain). Spring 컨텍스트 테스트는 변이마다 돌리기엔 느려 제외
// PIT 1.30.1은 공개 직후(2026-10-14)라 그 전 버전 사용
pitest {
	pitestVersion = '1.30.0'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['com.sentinel.runner.*', 'com.sentinel.application.importing.*', 'com.sentinel.domain.*']
	targetTests = ['com.sentinel.runner.*', 'com.sentinel.application.importing.*', 'com.sentinel.domain.*']
	// 가져오기 저장(트랜잭션·저장소)은 Spring 컨텍스트 테스트(CaseImportTest)만 확인. QueryDSL이 만든 Q 클래스는 검사 대상 아님
	excludedClasses = ['com.sentinel.application.importing.CaseImportService*', 'com.sentinel.domain.Q*']
	threads = 4
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}
