spring:
  application:
    name: sentinel
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      keepalive-time: 300000
      # PostgreSQL JDBC 드라이버 옵션. socketTimeout 기본값 0(무제한)은 쿼리 도중 네트워크 단절 시 무기한 대기
      data-source-properties:
        socketTimeout: 30
        connectTimeout: 10
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 변경은 Flyway 마이그레이션(db/migration)으로만 수행. 기동 시 엔티티와 테이블 일치 여부만 검증
      ddl-auto: validate
    properties:
      hibernate.default_schema: sentinel
      hibernate.format_sql: true
  flyway:
    # sentinel 스키마 미존재 시 생성, 이력 테이블(flyway_schema_history)도 이 스키마에 생성
    schemas: sentinel
    default-schema: sentinel
  mvc:
    problemdetails:
      enabled: true

sentinel:
  schedule:
    enabled: true
    zone: Asia/Seoul
    poll-interval: 60s
  runner:
    http:
      connect-timeout: 5s
      read-timeout: 30s
