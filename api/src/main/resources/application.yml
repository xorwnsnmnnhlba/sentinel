spring:
  application:
    name: sentinel
  datasource:
    # 기본값: 로컬 PostgreSQL. RDS·컨테이너 실행 시 sentinel.env로 재정의
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel?currentSchema=sentinel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      keepalive-time: 300000
      # PostgreSQL JDBC 드라이버 옵션. socketTimeout 기본값 0(무제한)은 쿼리 도중 네트워크 단절 시 무기한 대기
      data-source-properties:
        socketTimeout: 30
        connectTimeout: 10
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 변경은 Flyway 마이그레이션(db/migration)으로만 수행. 기동 시 엔티티와 테이블 일치 여부만 검증
      ddl-auto: validate
    properties:
      hibernate.default_schema: sentinel
      hibernate.format_sql: true
  flyway:
    # sentinel 스키마 미존재 시 생성, 이력 테이블(flyway_schema_history)도 이 스키마에 생성
    schemas: sentinel
    default-schema: sentinel
  mvc:
    problemdetails:
      enabled: true

sentinel:
  schedule:
    enabled: true
    zone: Asia/Seoul
    poll-interval: 60s
    # 스케줄이 예정 시각보다 이 시간 넘게 늦게 실행되면 모니터링 공백으로 기록·알림 (Sentinel 중지·서버 절전 등)
    gap-threshold: 10m
  digest:
    # 주간 요약 알림 (기본 채널). 발송일 전날까지 7일의 실행·통과율·불안정 케이스·응답시간·모니터링 공백
    enabled: true
    # 발송 시각 (초 분 시 일 월 요일). sentinel.schedule.zone 기준. 꺼져 있었으면 켜진 뒤 1회 발송 (7일 이내)
    cron: "0 0 9 * * MON"
  slowdown:
    # 응답시간 악화 알림 (프로젝트 채널). 케이스·환경별 최근 24시간 p95가 그 전 7일보다 50% 이상이면서 100ms 이상 느리면 1회, 회복도 1회
    enabled: true
    # 확인 시각 (초 분 시 일 월 요일). sentinel.schedule.zone 기준
    cron: "0 5 * * * *"
    increase-ratio: 0.5
    min-increase: 100ms
    recent-window: 24h
    baseline-window: 7d
    # 두 기간 각각 필요한 최소 응답 수
    min-samples: 5
  heartbeat:
    # 외부 생존 신호 주소. 스케줄 폴링이 DB까지 정상일 때마다 GET. 미지정 시 보내지 않음. 자격증명이므로 환경변수로 주입
    url: ${SENTINEL_HEARTBEAT_URL:}
    timeout: 5s
  retention:
    enabled: true
    # 요청·응답 원문(헤더·본문) 보관 기간. 지나면 원문만 비우고 실행·판정 기록은 유지
    raw-retention: 30d
    # 알림 발송 이력 보관 기간. 지나면 삭제
    notification-retention: 90d
    # 정리 배치 실행 시각 (초 분 시 일 월 요일). sentinel.schedule.zone 기준
    cron: "0 30 3 * * *"
    batch-size: 500
  runner:
    http:
      connect-timeout: 5s
      read-timeout: 30s
    retry:
      # 응답을 받지 못한 전송을 다시 보내는 최대 횟수 (0~3, 0이면 재시도 없음)와 다시 보내기 전 대기
      # 연결 실패는 모든 메서드, 타임아웃·연결 끊김은 조회 메서드(GET·HEAD·OPTIONS)만
      max-retries: 1
      delay: 1s
    manual:
      # 동시에 진행할 수 있는 수동 실행 수. 넘으면 새 실행을 429로 거부 (GW 동시 호출·DB 커넥션 점유 제한)
      max-concurrent: 4
  auth:
    # 세션 유효 기간. 만료 시각은 로그인 시점에 고정
    session-validity: 12h
    # 최초 관리자 계정. 사용자가 한 명도 없을 때만 생성
    admin-email: ${SENTINEL_ADMIN_EMAIL:}
    admin-password: ${SENTINEL_ADMIN_PASSWORD:}
    # 초대·재설정 링크 유효 기간
    invite-validity: 7d
    password-reset-validity: 2h
  secret:
    # 시크릿 암호화 키 (Base64, 16·24·32바이트). 미지정 시 시크릿 등록 거부
    # 생성 예: openssl rand -base64 32
    key: ${SENTINEL_SECRET_KEY:}
    # 키 교체 시 이전 키 (선택). 이 키로 저장된 값을 기동 시 현재 키로 다시 암호화. 확인 후 제거
    previous-key: ${SENTINEL_SECRET_KEY_PREVIOUS:}
  notification:
    # 수신 Webhook 주소. 미지정 시 알림을 로그로 기록. 자격증명이므로 환경변수로 주입
    webhook-url: ${SENTINEL_WEBHOOK_URL:}
    # 결과 화면 주소. 지정 시 실패 알림에 실행 결과 링크 추가
    web-base-url: ${SENTINEL_WEB_URL:}
    connect-timeout: 3s
    read-timeout: 5s
    # 같은 케이스가 계속 실패하는 동안 실패 알림을 다시 보내는 간격. 새로 실패·복구는 바로 발송. 0s이면 실행마다 발송
    repeat-interval: 1h
# springdoc은 문서 주소가 켜져 있으면 기동마다 "운영에서는 끄라"는 경고를 남김. 로그인 뒤에 두고 일부러 켠 것이라 그 경고만 숨김
logging:
  level:
    org.springdoc.core.events.SpringDocAppInitializer: error
# API 문서 (OpenAPI JSON). 다른 API와 같이 로그인 필요, 화면은 web의 "API 문서"
springdoc:
  api-docs:
    path: /api/openapi
  writer-with-order-by-keys: true
  # 응답 형식을 */* 대신 JSON으로 표시 (실행 상세의 XML은 별도 표시)
  default-produces-media-type: application/json
