spring:
  application:
    name: sentinel
  datasource:
    # 기본값: 로컬 PostgreSQL. RDS·컨테이너 실행 시 sentinel.env로 재정의
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel?currentSchema=sentinel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      keepalive-time: 300000
      # PostgreSQL JDBC 드라이버 옵션. socketTimeout 기본값 0(무제한)은 쿼리 도중 네트워크 단절 시 무기한 대기
      data-source-properties:
        socketTimeout: 30
        connectTimeout: 10
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 변경은 Flyway 마이그레이션(db/migration)으로만 수행. 기동 시 엔티티와 테이블 일치 여부만 검증
      ddl-auto: validate
    properties:
      hibernate.default_schema: sentinel
      hibernate.format_sql: true
  flyway:
    # sentinel 스키마 미존재 시 생성, 이력 테이블(flyway_schema_history)도 이 스키마에 생성
    schemas: sentinel
    default-schema: sentinel
  mvc:
    problemdetails:
      enabled: true

sentinel:
  schedule:
    enabled: true
    zone: Asia/Seoul
    poll-interval: 60s
  runner:
    http:
      connect-timeout: 5s
      read-timeout: 30s
  auth:
    # 세션 유효 기간. 만료 시각은 로그인 시점에 고정
    session-validity: 12h
    # 최초 관리자 계정. 사용자가 한 명도 없을 때만 생성
    admin-email: ${SENTINEL_ADMIN_EMAIL:}
    admin-password: ${SENTINEL_ADMIN_PASSWORD:}
  secret:
    # 시크릿 암호화 키 (Base64, 16·24·32바이트). 미지정 시 시크릿 등록 거부
    # 생성 예: openssl rand -base64 32
    key: ${SENTINEL_SECRET_KEY:}
  notification:
    # 수신 Webhook 주소. 미지정 시 알림을 로그로 기록. 자격증명이므로 환경변수로 주입
    webhook-url: ${SENTINEL_WEBHOOK_URL:}
    # 결과 화면 주소. 지정 시 실패 알림에 실행 결과 링크 추가
    web-base-url: ${SENTINEL_WEB_URL:}
    connect-timeout: 3s
    read-timeout: 5s
