spring:
  application:
    name: sentinel
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      keepalive-time: 300000
      # PostgreSQL JDBC 드라이버 옵션. socketTimeout 기본값 0(무제한)은 쿼리 도중 네트워크 단절 시 무기한 대기
      data-source-properties:
        socketTimeout: 30
        connectTimeout: 10
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_schema: sentinel
      hibernate.format_sql: true
  mvc:
    problemdetails:
      enabled: true

sentinel:
  schedule:
    enabled: true
    zone: Asia/Seoul
    poll-interval: 60s
  runner:
    http:
      connect-timeout: 5s
      read-timeout: 30s
